<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Smart Bookmarker</title>

  <style>
    :root { color-scheme: light; }

    body {
      width: 320px;
      padding: 16px;
      margin: 0;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #f8fafc;
    }

    h1 { font-size: 20px; margin: 0 0 4px; }
    .subtitle { color: #64748b; font-size: 13px; margin: 0 0 16px; }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 11px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
    input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button {
      width: 100%;
      padding: 10px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      color: white;
      background: #2563eb;
      font-weight: 600;
    }
    button:disabled { cursor: wait; opacity: .65; }
    .secondary { margin-top: 8px; color: #1d4ed8; background: transparent; }
    .session { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .session span { color: #475569; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout { width: auto; padding: 6px 8px; font-size: 12px; color: #b91c1c; background: transparent; }
    #status { min-height: 18px; margin-top: 10px; font-size: 13px; }
    #status.error { color: #b91c1c; }
    #status.success { color: #15803d; }
  </style>
</head>

<body>
  <h1>Smart Bookmarker</h1>
  <p class="subtitle">Save useful pages for later.</p>

  <section id="authView">
    <form id="authForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" minlength="8" required />
      </div>
      <button id="authSubmit" type="submit">Log in</button>
    </form>
    <button id="authModeToggle" class="secondary" type="button">Create an account</button>
  </section>

  <section id="captureView" class="hidden">
    <div class="session">
      <span id="signedInAs">Signed in</span>
      <button id="logoutButton" class="logout" type="button">Log out</button>
    </div>
    <button id="saveButton" type="button">Capture current page</button>
  </section>

  <div id="status"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
