name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Check database
        run: |
          node -e "const {Client}=require('pg'); const c=new Client({connectionString:process.env.TEST_DATABASE_URL}); c.connect().then(()=>console.log('Database connection successful')).catch(e=>{console.error(e.message); process.exit(1)}).finally(()=>c.end())"
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build