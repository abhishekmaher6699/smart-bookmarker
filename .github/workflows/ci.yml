name: CI

on:
  push:
    branches:
     - main
  pull_request:
    branches:
      - main
  
jobs:
  test:
  runs-on: ubuntu-latest

  env:
    DATABASE_URL: ${{ secrets.DATABASE_URL }}
    JWT_SECRET: ${{ secrets.JWT_SECRET  }}

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      used: actions/setup-node@v4
      with: 
        node-version: 20
        cache: npm
    
    - name: Install dependencied
      run: npm ci
    
    - name: Type check
      run: npx tsx --noEmit
    
    - name: Run tests
      run: npm test
    
    - name: Build
      run: npm run build
