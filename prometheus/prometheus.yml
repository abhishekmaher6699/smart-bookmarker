global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets:
          - api:3000

  - job_name: workers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        regex: worker
        action: keep

      - source_labels:
          - __meta_docker_network_ip
        regex: "(.+)"
        target_label: __address__
        replacement: "$1:9091"